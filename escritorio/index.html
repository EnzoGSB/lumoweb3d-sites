<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escritório LUMO WEB 3D</title>
  <link rel="icon" type="image/png" href="marca/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="estilo.css">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <main id="palco"></main>

  <header class="topo">
    <div class="marca">
      <img class="logo" src="marca/logo.png" alt="LUMO WEB 3D" width="44" height="44">
      <div><b>LUMO WEB 3D</b><small>Escritório · <span id="relogio">--:--</span><span id="atualizado"></span></small></div>
    </div>
    <dl class="metricas">
      <div><dt>Leads</dt><dd id="m-leads">–</dd></div>
      <div><dt>Sites no ar</dt><dd id="m-sites" class="destaque">–</dd></div>
      <div><dt>Na fila</dt><dd id="m-fila">–</dd></div>
      <div><dt>Trabalhando</dt><dd id="m-ativos">–</dd></div>
    </dl>
  </header>

  <aside class="painel">
    <section>
      <h2>Equipe</h2>
      <ul id="equipe" class="equipe"></ul>
    </section>
    <section>
      <h2>Sites publicados</h2>
      <ul id="sites" class="sites"></ul>
    </section>
    <section class="cresce">
      <h2>Atividade</h2>
      <ul id="atividade" class="atividade"></ul>
    </section>
  </aside>

  <div id="detalhe" class="detalhe" hidden>
    <button class="fechar" aria-label="Fechar">×</button>
    <div class="conteudo"></div>
  </div>

  <p class="dica">Arraste para girar · botão direito move · roda dá zoom · clique num funcionário</p>
  <p class="aviso-offline">Sem conexão com o servidor do escritório…</p>

  <script type="module" src="cena.js"></script>
</body>
</html>
